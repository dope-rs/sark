[package]
name = "sark-gen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Sark proc-macro generators"
authors.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
# Resolves the consumer's crate paths, including renamed dependencies.
proc-macro-crate = "3"
quote = "1"
syn = { version = "3", features = ["extra-traits", "full", "visit", "visit-mut"] }

[dev-dependencies]
dope-test.workspace = true
